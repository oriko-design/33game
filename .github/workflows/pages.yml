# GitHub Pages へ自動デプロイするワークフロー
# このブランチに push されるたびに index.html を公開サイトへ反映します
# 公開URL: https://oriko-design.github.io/33game/
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/sanjusangendo-game-prototype-qerp6z
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4
      - name: Pages を設定(未有効なら有効化)
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: サイト一式をアップロード
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: デプロイ
        id: deployment
        uses: actions/deploy-pages@v4
